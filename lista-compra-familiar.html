    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Lista de la Compra Familiar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #productoInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #productoInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-add {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .lista-compra {
            list-style: none;
        }

        .item-compra {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-compra:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .item-compra.comprado {
            opacity: 0.6;
            background: #e8f5e9;
        }

        .item-compra.comprado .producto-nombre {
            text-decoration: line-through;
            color: #888;
        }

        .checkbox-custom {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 50%;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .checkbox-custom.checked {
            background: #667eea;
        }

        .checkbox-custom.checked::after {
            content: '✓';
            color: white;
            font-weight: bold;
        }

        .producto-nombre {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .producto-info {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }

        .btn-delete {
            padding: 8px 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin-left: 10px;
        }

        .btn-delete:hover {
            background: #ff3344;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .btn-clear {
            width: 100%;
            padding: 15px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-clear:hover {
            background: #ff3344;
        }

        .family-members {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .member-badge {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Lista de la Compra</h1>
        <p class="subtitle">Toca la pegatina NFC para acceder</p>

        <form class="add-form" id="addForm">
            <input 
                type="text" 
                id="productoInput" 
                placeholder="Ej: Leche, Pan, Huevos..." 
                autocomplete="off"
                required
            >
            <button type="submit" class="btn-add">➕ Añadir</button>
        </form>

        <ul class="lista-compra" id="listaCompra">
            <!-- Los items se añadir aquí diná··micamente -->
        </ul>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📝</div>
            <p>La lista está vací··a</p>
            <p>Añ···ade productos arriba</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalItems">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="pendientesItems">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="compradosItems">0</div>
                <div class="stat-label">Comprados</div>
            </div>
        </div>

        <button class="btn-clear" id="btnClear" onclick="borrarLista()">🗑️ Borrar toda la lista</button>
    </div>

    <script>
        // Clave única para localStorage compartido entre dispositivos
        const STORAGE_KEY = 'lista_compra_familiar_v1';
        const FAMILY_ID = 'familia_' + window.location.hostname;
        
        // Estado inicial
        let listaCompra = [];
        let usuarioActual = 'Usuario ' + Math.floor(Math.random() * 100);

        // Cargar lista desde localStorage
        function cargarLista() {
            const guardado = localStorage.getItem(STORAGE_KEY);
            if (guardado) {
                listaCompra = JSON.parse(guardado);
            }
            renderizarLista();
        }

        // Guardar lista en localStorage
        function guardarLista() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(listaCompra));
            renderizarLista();
        }

        // Añadir producto
        function añadirProducto(nombre) {
            const nuevoItem = {
                id: Date.now(),
                nombre: nombre.trim(),
                comprado: false,
                fecha: new Date().toLocaleString('es-ES'),
                usuario: usuarioActual
            };
            listaCompra.unshift(nuevoItem);
            guardarLista();
        }

        // Marcar/desmarcar como comprado
        function toggleComprado(id) {
            const item = listaCompra.find(i => i.id === id);
            if (item) {
                item.comprado = !item.comprado;
                item.fechaActualizacion = new Date().toLocaleString('es-ES');
                guardarLista();
            }
        }

        // Eliminar producto
        function eliminarProducto(id) {
            listaCompra = listaCompra.filter(i => i.id !== id);
            guardarLista();
        }

        // Borrar toda la lista
        function borrarLista() {
            if (confirm('⚠️ ¿Seguro que quieres borrar TODA la lista?')) {
                listaCompra = [];
                guardarLista();
            }
        }

        // Renderizar la lista
        function renderizarLista() {
            const listaEl = document.getElementById('listaCompra');
            const emptyState = document.getElementById('emptyState');
            const btnClear = document.getElementById('btnClear');

            listaEl.innerHTML = '';

            if (listaCompra.length === 0) {
                emptyState.style.display = 'block';
                btnClear.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                btnClear.style.display = 'block';

                listaCompra.forEach(item => {
                    const li = document.createElement('li');
                    li.className = `item-compra ${item.comprado ? 'comprado' : ''}`;
                    
                    li.innerHTML = `
                        <div class="checkbox-custom ${item.comprado ? 'checked' : ''}" 
                             onclick="toggleComprado(${item.id})"></div>
                        <div class="producto-nombre">${escapeHtml(item.nombre)}</div>
                        <div class="producto-info">
                            <div class="family-members">
                                <span class="member-badge">${escapeHtml(item.usuario)}</span>
                            </div>
                            <small>${item.fecha}</small>
                        </div>
                        <button class="btn-delete" onclick="eliminarProducto(${item.id})">🗑️</button>
                    `;
                    
                    listaEl.appendChild(li);
                });
            }

            // Actualizar estadí··sticas
            document.getElementById('totalItems').textContent = listaCompra.length;
            document.getElementById('pendientesItems').textContent = 
                listaCompra.filter(i => !i.comprado).length;
            document.getElementById('compradosItems').textContent = 
                listaCompra.filter(i => i.comprado).length;
        }

        // Escapar HTML para seguridad
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('productoInput');
            if (input.value.trim()) {
                añadirProducto(input.value);
                input.value = '';
                input.focus();
            }
        });

        // Cargar al iniciar
        cargarLista();

        // Escuchar cambios en localStorage (para sincronizaciñ···n entre pestañ···s)
        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_KEY) {
                cargarLista();
            }
        });

        // Service Worker para PWA (opcional, para instalar como app)
        if ('serviceWorker' in navigator) {
            // Registrar service worker si existe
        }
    </script>
</body>
</html>
